apiVersion: v1
kind: Service
metadata:
  name: cloud-k8s-app
spec:
  type: ClusterIP                  # stable internal address for the pods
  selector:
    app: cloud-k8s-app             # sends traffic to pods with this label
  ports:
    - port: 80                     # port on the Service
      targetPort: 8080             # port inside the container
