name: Build and push image

# Builds app/ and pushes it to GitHub Container Registry (ghcr.io).
# Runs when app/ changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # lets the built-in GITHUB_TOKEN push to ghcr.io

env:
  IMAGE: ghcr.io/bat-sr/cloud-k8s-app   # must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1
            ${{ env.IMAGE }}:${{ github.sha }}
